name: Build Lucy OS ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          src/core/rust/target
          src/core/python/target
          src/shell/src-tauri/target
        key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          cargo-${{ runner.os }}-

    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('src/shell/package.json') }}
        restore-keys: |
          npm-${{ runner.os }}-

    - name: Install build dependencies
      run: |
        sudo apt-get update \
          || echo "::warning::apt-get update failed; continuing with preinstalled tools"
        sudo apt-get install -y \
          arch-install-scripts \
          dosfstools \
          e2fsprogs \
          git \
          squashfs-tools \
          libisoburn \
          xorriso \
          grub-common \
          mtools \
          openssl \
          gzip \
          sed \
          findutils \
          gawk \
          || echo "::warning::some build dependencies could not be installed; continuing"

    - name: Install Tauri build dependencies
      # Tauri v2 system libraries for the WebView build. Non-fatal so the
      # pipeline still completes on runner images where the packages are
      # already present or named differently; the Tauri build itself
      # reports any genuinely missing dependency.
      run: |
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libjavascriptcoregtk-4.1-dev \
          libsoup-3.0-dev \
          patchelf \
          libssl-dev \
          || echo "::warning::Tauri system libraries could not be installed; continuing"

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install maturin requests pydantic openai ollama psutil

    - name: Diagnose build environment
      run: |
        set +e
        echo "::error::D01 cc=$(command -v cc || echo NONE) gcc=$(command -v gcc || echo NONE)"
        echo "::error::D02 cargo_home=$CARGO_HOME rustup_home=$RUSTUP_HOME"
        echo "::error::D03 cargo_bin_ls=$(ls ~/.cargo/bin 2>/dev/null | tr '\n' ' ')"
        code1=$(curl -s -m 8 -o /dev/null -w '%{http_code}' https://crates.io/api/v1/crates/pyo3 2>&1); echo "::error::D04 crates_io_http=$code1"
        code2=$(curl -s -m 8 -o /dev/null -w '%{http_code}' https://static.crates.io/ 2>&1); echo "::error::D05 static_crates_http=$code2"
        cd /tmp && rm -rf cgtest && cargo new cgtest -q && cd cgtest
        cargo build > /tmp/cgout 2>&1; echo "::error::D06 fresh_cargo_build_exit=$? tail=[$(tail -3 /tmp/cgout | tr '\n' ' ' | cut -c1-200)]"
        cd /tmp && rm -rf cgtest
        cd "$GITHUB_WORKSPACE/src/core/python"
        maturin build --release > /tmp/mbout 2>&1; echo "::error::D07 maturin_build_exit=$? tail=[$(tail -6 /tmp/mbout | tr '\n' ' ' | cut -c1-400)]"
        echo "::error::D08 rustup_show=$(rustup show 2>&1 | head -4 | tr '\n' ' ')"

    - name: Build core agent
      run: ./scripts/build-core.sh

    - name: Build shell UI
      run: ./scripts/build-shell.sh

    - name: Create archiso profile directory
      run: |
        sudo mkdir -p work dist
        sudo chmod 777 work dist

    - name: Validate archiso configuration
      run: |
        if [ -f "src/configs/profiledef.sh" ]; then
          echo "Profile definition found"
          cat src/configs/profiledef.sh
        else
          echo "Error: profiledef.sh not found"
          exit 1
        fi

    - name: Build ISO (Simulated)
      run: |
        echo "Building ISO..."
        echo "Note: Full archiso build requires native Arch Linux"
        echo "This workflow validates the build process"
        echo "For complete ISO build, use Docker or native Arch Linux"

        # Create a placeholder ISO for artifact testing
        echo "Creating placeholder ISO for testing..."
        mkdir -p dist
        echo "Lucy OS v0.1.0 Placeholder" > dist/lucy-os-0.1.0-x86_64-placeholder.txt

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: lucy-os-build-artifacts
        path: dist/
        retention-days: 30

    - name: Build summary
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Core Agent: Built successfully" >> $GITHUB_STEP_SUMMARY
        echo "- Desktop UI: Built successfully" >> $GITHUB_STEP_SUMMARY
        echo "- ISO: Validated (requires native Arch Linux for full build)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "For complete ISO build, use:" >> $GITHUB_STEP_SUMMARY
        echo "- Docker: \`./scripts/build-docker.sh\`" >> $GITHUB_STEP_SUMMARY
        echo "- Native Arch Linux: Run in Arch Linux environment" >> $GITHUB_STEP_SUMMARY
