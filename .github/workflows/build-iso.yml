name: Build Lucy OS ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          src/core/rust/target
          src/core/python/target
          src/shell/src-tauri/target
        key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
        restore-keys: |
          cargo-${{ runner.os }}-

    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: npm-${{ runner.os }}-${{ hashFiles('src/shell/package.json') }}
        restore-keys: |
          npm-${{ runner.os }}-

    - name: Install build dependencies
      run: |
        sudo apt-get update \
          || echo "::warning::apt-get update failed; continuing with preinstalled tools"
        sudo apt-get install -y \
          arch-install-scripts \
          dosfstools \
          e2fsprogs \
          git \
          squashfs-tools \
          libisoburn \
          xorriso \
          grub-common \
          mtools \
          openssl \
          gzip \
          sed \
          findutils \
          gawk \
          || echo "::warning::some build dependencies could not be installed; continuing"

    - name: Install Tauri build dependencies
      # Tauri v2 system libraries for the WebView build. Non-fatal so the
      # pipeline still completes on runner images where the packages are
      # already present or named differently; the Tauri build itself
      # reports any genuinely missing dependency.
      run: |
        sudo apt-get install -y \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libjavascriptcoregtk-4.1-dev \
          libsoup-3.0-dev \
          patchelf \
          libssl-dev \
          || echo "::warning::Tauri system libraries could not be installed; continuing"

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install maturin requests pydantic openai ollama psutil

    - name: Build core agent
      run: ./scripts/build-core.sh

    - name: Build shell UI
      run: ./scripts/build-shell.sh

    - name: Create archiso profile directory
      run: |
        sudo mkdir -p work dist
        sudo chmod 777 work dist

    - name: Validate archiso configuration
      run: |
        if [ -f "src/configs/profiledef.sh" ]; then
          echo "Profile definition found"
          cat src/configs/profiledef.sh
        else
          echo "Error: profiledef.sh not found"
          exit 1
        fi

    - name: Check available disk space
      run: df -h /

    - name: Free disk space for ISO build
      run: |
        # The archiso build needs significant disk space (~25GB).
        # Clean up runner images and package caches to make room.
        docker system prune -f || true
        docker image prune -a -f || true
        sudo apt-get clean || true
        df -h /

    - name: Build ISO (Docker)
      run: |
        ./scripts/build-docker.sh
        echo "Verifying ISO output..."
        ls -lh dist/*.iso
        ISO_SIZE=$(stat -c%s dist/*.iso)
        echo "Built ISO size: $ISO_SIZE bytes"

    - name: Upload ISO artifact
      uses: actions/upload-artifact@v4
      with:
        name: lucy-os-build-artifacts
        path: dist/*.iso
        if-no-files-found: error
        retention-days: 30

    - name: Build summary
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- Core Agent: Built successfully" >> $GITHUB_STEP_SUMMARY
        echo "- Desktop UI: Built successfully" >> $GITHUB_STEP_SUMMARY
        echo "- ISO: Built in Arch Linux Docker container" >> $GITHUB_STEP_SUMMARY
        echo "- Artifact: lucy-os-build-artifacts (dist/*.iso)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Download the ISO from the workflow run artifacts." >> $GITHUB_STEP_SUMMARY
