[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "lucy-agent"
version = "0.1.0"
description = "Lucy OS AI Agent Daemon"
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "python-systemd>=235",
]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "lucy_core.lucy_core"

[tool.pytest.ini_options]
testpaths = ["tests"]
