DEFAULT lucy
TIMEOUT 50
PROMPT 0

LABEL lucy
TEXT HELP
Boot the Lucy OS install medium on BIOS.
It allows you to install Lucy OS or perform system maintenance.
END TEXT
MENU LABEL Lucy OS install medium (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% archiso_uuid=%ARCHISO_UUID%
