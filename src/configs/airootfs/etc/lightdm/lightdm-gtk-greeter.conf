#
# Lucy OS LightDM GTK greeter — styled to match the shell.
#
# Autologin normally skips the greeter entirely; this only matters if autologin
# is turned off, or briefly during startup. Icon/theme names below are the ones
# actually installed on the medium (Papirus ships with the ISO; Adwaita-dark is
# built into GTK3), so the greeter never falls back to a missing theme.
#
# deepin-gtk-theme and deepin-icon-theme are also installed — pick them from
# lxappearance if you prefer the Deepin look.
#

[greeter]
theme-name = Adwaita-dark
icon-theme-name = Papirus-Dark
font-name = Sans 11
xft-antialias = true
xft-hintstyle = hintslight
xft-rgba = rgb

# Clock + indicators on the login screen.
clock-format = %H:%M  %a %d %b
indicators = ~host;~spacer;~clock;~spacer;~session;~power

# Hide the user list and the manual-login escape hatch.
hide-user-image = false
position = center

# Obsidian background colour; keeps the greeter on-brand without shipping a
# large background image.
background = #0b0b0d
