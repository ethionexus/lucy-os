[Settings]
# Lucy OS live session appearance.
#
# Only names that are guaranteed to be installed are used here: Adwaita-dark
# ships with GTK3, and Papirus-Dark comes from papirus-icon-theme. The
# Deepin themes are installed too — pick them in lxappearance if you prefer.
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Sans 10
gtk-application-prefer-dark-theme=1
gtk-enable-animations=1
