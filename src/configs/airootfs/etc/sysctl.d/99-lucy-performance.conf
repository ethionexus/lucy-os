# Lucy OS performance tuning — fast boot, smooth 60fps glassmorphic UI.
# Installed to /etc/sysctl.d/ by the archiso profile.

# Responsiveness: favor interactivity over throughput.
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Faster boot: parallel systemd startup is the default; keep the
# journal small on the live medium so logging never blocks the UI.
kernel.printk = 3 3 3 3

# Network: larger buffers for smooth streaming and proxy throughput.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_fastopen = 3
