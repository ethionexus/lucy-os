# Lucy OS — archiso initramfs hooks.
#
# This is a drop-in for /etc/mkinitcpio.conf (read from
# /etc/mkinitcpio.conf.d/*.conf), mirroring the upstream archiso releng
# profile. It must live in the airootfs so it is present when pacstrap builds
# the initramfs.
#
# Why this file exists
# --------------------
# archiso does not build the initramfs itself; it copies whatever is in
# /boot of the installed root to the ISO. Without the `archiso` hook the
# initramfs has no way to locate and mount the live medium, so boot fails
# with:
#
#     [FAILED] Failed to start Switch Root
#     You are in emergency mode
#
# `archiso` finds the medium (by label/UUID) and `archiso_loop_mnt` loop-mounts
# the airootfs squashfs. Both MUST come before `block` and `filesystems`,
# because they create the block device that those hooks then mount.
#
# The upstream releng list also carries the archiso_pxe_* hooks. Those are
# intentionally omitted: they require mkinitcpio-nfs-utils and nbd, which
# Lucy OS does not ship, and pulling them in would make mkinitcpio fail with
# "Hook ... cannot be found". `memdisk` and `microcode` are likewise dropped —
# no netboot and no ucode packages are installed.
#
# `plymouth` sits immediately after `udev` so the boot splash takes over as
# early as possible. It must stay before `kms`, which hands the framebuffer
# from the firmware driver over to the KMS driver.

HOOKS=(base udev plymouth modconf kms archiso archiso_loop_mnt block filesystems keyboard)

COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
