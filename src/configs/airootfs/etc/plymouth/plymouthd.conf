#
# Lucy OS Plymouth daemon configuration.
#
# "lucy" is shipped in this profile (usr/share/plymouth/themes/lucy), so it
# always exists. If Plymouth ever fails to draw (unusual GPU/VM), it logs the
# error and boot continues normally — a splash problem never blocks startup.
# To bypass it entirely, add plymouth.enable=0 to the kernel command line.
#

[Daemon]
Theme=lucy
ShowDelay=0
# Give slow/emulated devices a chance to appear before giving up on KMS.
DeviceTimeout=8
