# Lucy OS AI Agent Configuration

[daemon]
# Log directory
log_dir = /var/log/lucy

# Maximum log size
max_log_size = 100M

# IPC port for communication
ipc_port = 8080

# Auto-start on boot
autostart = true

[safety]
# Require confirmation for medium-risk commands
require_confirmation = true

# Enable command whitelist
enable_whitelist = true

[ai]
# AI model to use
model = gpt-3.5-turbo

# Maximum tokens for AI responses
max_tokens = 500

# Temperature for AI responses
temperature = 0.7

# Fallback to local Ollama when offline
fallback_to_ollama = true
ollama_model = llama2
ollama_endpoint = http://localhost:11434

# --- Optional multi-language AI (v0.3.0, Week 4) ---
# English is always the default. Individual requests may opt in per-message
# with a directive, e.g. "/lang:am show disk usage". Supported codes:
# en, am, fr, ar, es, zh, ru. Set ai_language to make one of them the
# session default; leave as "en" to keep English.
ai_language = en

[auto_healing]
# Enable auto-healing
enabled = true

# Thresholds (percentage)
memory_threshold = 85
disk_threshold = 90

# Actions
clear_cache = true
rotate_logs = true
max_log_size = 100M

# Check interval (seconds)
check_interval = 300

# --- Instant rollback engine (v0.3.0) ---
# Enable journal fault watching + snapshot/rollback
rollback_enabled = true
# Create a baseline snapshot on every boot
snapshot_on_boot = true
# Journal fault scan interval (seconds)
journal_scan_interval = 60
# Consecutive failed boots before an automatic rollback fires
rollback_fail_threshold = 3
