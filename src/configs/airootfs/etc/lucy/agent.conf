# Lucy OS AI Agent Configuration

[daemon]
# Log directory
log_dir = /var/log/lucy

# Maximum log size
max_log_size = 100M

# IPC port for communication
ipc_port = 8080

# Auto-start on boot
autostart = true

[safety]
# Require confirmation for medium-risk commands
require_confirmation = true

# Enable command whitelist
enable_whitelist = true

[ai]
# AI model to use
model = gpt-3.5-turbo

# Maximum tokens for AI responses
max_tokens = 500

# Temperature for AI responses
temperature = 0.7

# Fallback to local Ollama when offline
fallback_to_ollama = true
ollama_model = llama2
ollama_endpoint = http://localhost:11434

[auto_healing]
# Enable auto-healing
enabled = true

# Thresholds (percentage)
memory_threshold = 85
disk_threshold = 90

# Actions
clear_cache = true
rotate_logs = true
max_log_size = 100M

# Check interval (seconds)
check_interval = 300
