---
# Lucy OS Calamares settings.
#
# NOTE: the `calamares` package itself lives in the AUR (not the official
# repos), so it is deliberately NOT in packages.x86_64 — pacstrap would abort
# with "target not found" and break the ISO build. customize_airootfs.sh
# probes for it best-effort, and `lucy-installer` falls back to archinstall.
# All configuration below is in place for when Calamares is available.
modules-search: [ local ]
branding: lucy
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false

instances:
  - id: postinstall
    module: shellprocess
    config: shellprocess-postinstall.conf

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - locale
    - keyboard
    - localecfg
    - fstab
    - initcpiocfg
    - initcpio
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services-systemd
    - initramfs
    - bootloader
    - shellprocess@postinstall
    - umount
  - show:
    - finished
