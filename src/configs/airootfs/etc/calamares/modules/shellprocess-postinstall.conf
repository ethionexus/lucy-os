---
# Lucy OS post-install steps.
#
# Runs on the LIVE system against the target mounted at ${ROOT} (dontChroot:
# true). This is why every path is written as ${ROOT}/... rather than as a
# bare in-chroot path — with dontChroot: false those paths do not exist and
# every command below would silently fail.
dontChroot: true
timeout: 999
script:
    # Enable Lucy OS services in the installed system.
    - "systemctl enable NetworkManager --root=${ROOT}"
    - "systemctl enable bluetooth --root=${ROOT}"
    - "systemctl enable sing-box --root=${ROOT}"

    # CRITICAL: the live medium's archiso initcpio drop-in must not survive
    # into the installed system. The target has no live medium, so leaving the
    # archiso hook in HOOKS makes it unbootable
    # ("Failed to start Switch Root"). Remove it and rebuild the initramfs.
    - "rm -f ${ROOT}/etc/mkinitcpio.conf.d/archiso.conf"
    - "rmdir ${ROOT}/etc/mkinitcpio.conf.d 2>/dev/null || true"
    - "arch-chroot ${ROOT} mkinitcpio -P"

    # Make sure the target's fstab is regenerated without the live mounts.
    - "rm -f ${ROOT}/home/*/Desktop/calamares.desktop"
