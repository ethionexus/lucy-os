---
# Lucy OS Calamares initcpiocfg.
#
# Sets the HOOKS for the INSTALLED system's /etc/mkinitcpio.conf. It must not
# contain the archiso hooks: the target is a normal installation with no live
# medium, so leaving `archiso` in HOOKS makes it unbootable.
#
# This module rewrites /etc/mkinitcpio.conf, but the live medium's drop-in
# /etc/mkinitcpio.conf.d/archiso.conf would override it — so the drop-in is
# also excluded in unpackfs.conf and deleted in shellprocess-postinstall.conf.
# Belt and braces, because getting this wrong bricks the installed system.

# Keep it close to the stock Arch set, ordered correctly.
hooks:
    - base
    - udev
    - autodetect
    - microcode
    - modconf
    - kms
    - keyboard
    - keymap
    - consolefont
    - block
    - filesystems
    - fsck
