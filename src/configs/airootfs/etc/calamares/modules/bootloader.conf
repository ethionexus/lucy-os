---
# Lucy OS Calamares bootloader module.
#
# GRUB is used because it handles both BIOS and UEFI and understands Btrfs
# subvolumes (the root is the /@ subvolume, so the kernel needs
# rootflags=subvol=@). os-prober lets it find other installed systems.

efiBootLoader: "grub"
kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
timeout: 5
installEFIFallback: true

# Present an OS list on boot so the user can pick another system.
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
