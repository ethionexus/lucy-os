---
# Lucy OS Calamares unpackfs.
#
# Copies the running live root onto the target. archiso keeps the airootfs
# mounted at /run/archiso/airootfs (the squashfs is loop-mounted there by the
# archiso_loop_mnt initcpio hook), so the live tree can be copied directly
# with sourcefs "file" without hardcoding the ISO's install_dir/arch.
#
# If you prefer to unsquash the image itself instead, use:
#   source:     "/run/archiso/bootmnt/lucy/x86_64/airootfs.sfs"
#   sourcefs:   "squashfs"
#
# The destination root ("") is the target the user picked in the partition
# step. Live-only state is excluded so the installed system does not inherit
# the live overlay.

unpack:
    -   source: "/run/archiso/airootfs"
        sourcefs: "file"
        destination: ""
        exclude:
            - "/run/archiso"
            - "/run/archiso/*"
            - "/etc/mkinitcpio.conf.d/archiso.conf"
