---
# Lucy OS Calamares mount module.
#
# These are the kernel pseudo-filesystems that must exist inside the target
# while Calamares works on it. The Btrfs subvolume layout itself is applied by
# the partition module (see partition.conf).

extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc

    - device: sys
      fs: sysfs
      mountPoint: /sys

    - device: /dev
      fs: none
      mountPoint: /dev
      options: [ bind ]
