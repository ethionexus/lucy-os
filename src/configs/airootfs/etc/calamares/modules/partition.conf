---
# Lucy OS Calamares partitioning.
#
# Btrfs is the default because Lucy OS's self-healing/instant-rollback engine
# (lucy_agent.snapshot) requires Btrfs snapshots. The @snapshots subvolume is
# mounted at /.snapshots, which is exactly where lucy-autoheal and
# lucy-rollback expect to find them.
#
# Calamares substitutes these subvolumes whenever a Btrfs root is created, so
# an installed system gets the same layout the rollback engine was built for.

defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs", "ext4", "xfs"]

# Always show labels so users can tell partitions apart.
alwaysShowPartitionLabels: true

# Do not allow the live medium itself to be picked as an install target.
drawNestedPartitions: false

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@

    - mountPoint: /home
      subvolume: /@home

    - mountPoint: /var/cache
      subvolume: /@cache

    - mountPoint: /var/log
      subvolume: /@log

    # Used by Lucy OS snapshots / instant rollback.
    - mountPoint: /.snapshots
      subvolume: /@snapshots
