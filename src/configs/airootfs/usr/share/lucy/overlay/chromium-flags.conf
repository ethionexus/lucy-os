# Lucy OS Chromium hardware-acceleration flags.
#
# Arch's chromium launcher sources this file (and the per-user
# ~/.config/chromium-flags.conf) for extra command-line flags. These enable
# GPU rasterisation and VA-API video decode on X11 with mesa.
#
# Everything here is a hint: an unsupported flag is ignored with a warning,
# so this cannot stop the browser from starting. Users can override per-user
# in ~/.config/chromium-flags.conf.

--ignore-gpu-blocklist
--enable-features=VaapiVideoDecoder,VaapiVideoEncoder,CanvasOopRasterization
--enable-gpu-rasterization
--enable-zero-copy
