#
# Lucy OS LightDM configuration — live medium.
#
# The live user "lucy" is created by airootfs/root/customize_airootfs.sh with
# an empty password and passwordless sudo. Autologin goes straight to the
# desktop: no greeter prompt, no TTY login, no password.
#
# display-manager.service is symlinked to lightdm.service in the same hook, so
# systemd starts this before graphical.target.
#

[LightDM]
# Do not start until logind says a graphical session can exist; avoids the
# classic race where X starts before the seat is ready.
logind-check-graphical=true
run-directory=/run/lightdm
# Keep the greeter off the other VTs so tty2-6 stay usable for rescue.
start-default-seat=true

[Seat:*]
# --- passwordless live autologin ---
autologin-user=lucy
# 0 = log in immediately, never wait for input.
autologin-user-timeout=0
autologin-session=lucy

greeter-session=lightdm-gtk-greeter
# Fall back to this session if autologin is ever disabled.
user-session=lucy
session-wrapper=/etc/lightdm/Xsession

# Never show a list of users or an "other" prompt on the live medium.
greeter-hide-users=true
greeter-show-manual-login=false
allow-guest=false

# X11: the live desktop runs on Xorg (openbox/LXDE).
xserver-command=X -nolisten tcp
